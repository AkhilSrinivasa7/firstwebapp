<!DOCTYPE html>
<html>
<head>
    <title>Function Concept</title>
</head>
<body>
    <h1>Function Concept</h1>
    <script>
        const pi = 3.14;
        // Function Declaration
        function area_of_circle(r) {
            return pi * r * r;
        }
        // Function Call
        console.log("Area of Circle:", area_of_circle(5));

        // Arrow Function
        const area_of_cylinder = (r, h) => {
            return 2 * pi * r * h;
        };
        // Function Call
        console.log("Area of Cylinder:", area_of_cylinder(5, 3));
    </script>+
    
</body>
</html>
