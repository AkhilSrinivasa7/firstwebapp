<html>
    <head>
        <style>
            p{
                color:red;
            }
        </style>
    </head>
    <body>
        <input type = "text" id ="pass" placeholder = "Enter password">
        <div id ="valid" style=" display : none;" >
            <p id = "pass_len">Minimum 8 characters</p>
            <p id = "pass_upper">Minimum Upper case</p>
            <p id = "pass_lower">Minimum one lower case</p>
            <p id = "pass_number">Minimum one number</p>
        </div>
        <script>
            document.getElementById("pass").addEventListener('keyup',function(){
                let pass_length = document.getElementById("pass").value.length;
                if(pass_length>0){
                    document.getElementById("valid").style.display="block";
                }else{
                    document.getElementById("valid").style.display="none"
                }
                if(pass_length>=8){
                    document.getElementById("pass_len").style.color="green";
                }else{
                    document.getElementById("pass_len").style.color="red";
                }
                let password = document.getElementById("pass").value;
                //minimum one upper case
                if(/[A-Z]/.test(password)){
                    document.getElementById("pass_upper").style.color="green";
                }else{
                        document.getElementById("pass_upper").style.color="red"
                }
                //minimum one lower case
                if((/[a-z]/).test(password)){
                    document.getElementById("pass_lower").style.color = "green";
                }else{
                    document.getElementById("pass_lower").style.color="red"
                }
                //minimum one number
                if((/[0-9]/).test(password)){
                    document.getElementById("pass_number").style.color = "green";
                }else{
                    document.getElementById("pass_number").style.color="red"
                }
            })
        </script>
    </body>
</html>
